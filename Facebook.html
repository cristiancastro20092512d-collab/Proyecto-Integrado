<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solvanta Energy | Energía solar</title>
    <link rel="icon" href="img/logo.png" />
    <link rel="stylesheet" href="Facebookdiseño.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="page">
        <div class="cover">
            <img src="img/cover.jpg" alt="Paneles solares" />
            <div class="cover-top">
                <i data-lucide="chevron-left"></i>
                <div class="row"><i data-lucide="pencil"></i><i data-lucide="search"></i></div>
            </div>
            <button class="cam" aria-label="Cambiar portada"><i data-lucide="camera"></i></button>
        </div>

        <div class="profile">
            <div class="avatar-wrap">
                <span class="note">☀️ ¡Cotiza gratis!</span>
                <img class="avatar" src="img/logo.png" alt="Logo Solvanta Energy" />
            </div>
            <h1>Solvanta Energy <span class="gold">●</span></h1>
            <p class="stats"><b>12 mil</b> <span class="muted">seguidores ·</span> <b>500+</b> <span
                    class="muted">instalaciones</span></p>
            <ul class="info">
                <li><i data-lucide="sun" class="gold"></i> Impulsando al mundo con la luz del mañana</li>
                <li><i data-lucide="zap" class="green"></i> Paneles solares · Baterías · Mantenimiento</li>
                <li><i data-lucide="map-pin" class="green"></i> Guatemala</li>
                <li><i data-lucide="phone" class="green"></i> Llámanos para tu cotización</li>
            </ul>
            <div class="actions">
                <button class="btn primary" id="btnCotizar"><i data-lucide="plus"></i> Pedir cotización</button>
                <button class="btn secondary" id="btnMensaje"><i data-lucide="message-circle"></i> Mensaje</button>
                <button class="btn secondary small"><i data-lucide="more-horizontal"></i></button>
            </div>
        </div>

        <div class="content">
            <div class="tabs" id="tabs">
                <span class="tab active">Todo</span><span class="tab">Fotos</span><span
                    class="tab">Servicios</span><span class="tab">Proyectos</span>
            </div>

            <h2>Lo más destacado</h2>
            <div class="highlights" id="highlights">
                <div class="hl">
                    <div class="hl-box new"><i data-lucide="plus"></i></div><span>Nueva</span>
                </div>
            </div>

            <div class="row between">
                <h2>Clientes felices</h2><a href="#" class="link">Ver todo</a>
            </div>
            <div class="clients" id="clients"></div>
        </div>
    </div>

    <nav class="bottom-nav" id="nav"></nav>

    <script src="Facebookcodigo.js"></script>
</body>

</html>
