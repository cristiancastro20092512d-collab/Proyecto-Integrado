<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicia sesion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="estiloiniciodesesion.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-solvanta sticky-top" data-bs-theme="dark">
        <div class="container-fluid px-lg-4">
            <img src="img/solvanta_ovalo.png" alt="Solvanta Energy" width="120" class="d-inline-block align-middle">
        </div>
    </nav>

    <main class="pagina-login">
        <div class="tarjeta-login">

            <img src="img/Logo solar Solvanta en verde y dorado.png" alt="Solvanta Energy" class="logo">

            <!-- ========== VISTA: INICIAR SESIÓN ========== -->
            <div id="vistaLogin" class="vista">
                <h2>Bienvenido de nuevo</h2>
                <p class="subtitulo">Ingresa a tu cuenta de Solvanta</p>

                <div class="mensaje-error oculto" id="errorLogin" role="alert"></div>
                <!-- NUEVO -->
                <div class="mensaje-ok oculto" id="okRegistro" role="status"></div>

                <form id="formularioLogin">
                    <div class="mb-3">
                        <label for="loginCorreo" class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" id="loginCorreo" name="correo"
                            placeholder="tucorreo@ejemplo.com" required autocomplete="email">
                    </div>

                    <div class="mb-4">
                        <label for="loginClave" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="loginClave" name="clave" placeholder="••••••••"
                            required autocomplete="current-password">
                    </div>

                    <button type="submit" class="btn btn-solvanta">Iniciar sesión</button>
                </form>

                <p class="pie-tarjeta">
                    ¿No tienes cuenta?
                    <button type="button" class="enlace-vista" data-vista="vistaRegistro">Crear cuenta</button>
                </p>
            </div>

            <!-- ========== VISTA: CREAR CUENTA ========== -->
            <div id="vistaRegistro" class="vista oculto">
                <h2>Crea tu cuenta</h2>
                <p class="subtitulo">Empieza tu camino hacia la energía solar</p>

                <!-- NUEVO -->
                <div class="mensaje-error oculto" id="errorRegistro" role="alert"></div>

                <form id="formularioRegistro">
                    <div class="mb-3">
                        <label for="regNombre" class="form-label">Nombre completo</label>
                        <input type="text" class="form-control" id="regNombre" name="nombre" placeholder="Tu nombre"
                            required autocomplete="name">
                    </div>

                    <div class="mb-3">
                        <label for="regCorreo" class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" id="regCorreo" name="correo"
                            placeholder="tucorreo@ejemplo.com" required autocomplete="email">
                    </div>

                    <div class="mb-3">
                        <label for="regClave" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="regClave" name="clave"
                            placeholder="Mínimo 8 caracteres" minlength="8" required autocomplete="new-password">
                    </div>

                    <div class="mb-4">
                        <label for="regClave2" class="form-label">Confirmar contraseña</label>
                        <input type="password" class="form-control" id="regClave2" name="clave2"
                            placeholder="Repite tu contraseña" minlength="8" required autocomplete="new-password">
                    </div>

                    <button type="submit" class="btn btn-solvanta">Crear cuenta</button>
                </form>

                <p class="pie-tarjeta">
                    ¿Ya tienes cuenta?
                    <button type="button" class="enlace-vista" data-vista="vistaLogin">Iniciar sesión</button>
                </p>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="codigo.js"></script>
</body>

</html>
